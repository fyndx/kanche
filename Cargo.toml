[package]
name = "kanche"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
rust-version = "1.99.1"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
