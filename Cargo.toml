[package]
name = "kanche"
default-run = "kanche"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
rust-version = "1.99.1"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
hex = "0.4.3"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-postgres = "0.7.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Password work must remain usable under the normal debug developer workflow.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
